<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Page</title>        
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class ="container">
        <section class ="subscribe-section">
            <div class="subscribe-card">
                <h2 class ="subcribe-heading">
                    subcribe to get information,latest news and other
                     interesting offers about Travel
                </h2>
                <form class="subscribe-form">
                    <div class="input-wrapper">
                         <svg class="mail-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m2 6 10 7 10-7"></path>
                        </svg>
                        <input type="email" class ="email-input" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn subscribe-btn">Subscribe</button>
                </form>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>      
</html>
